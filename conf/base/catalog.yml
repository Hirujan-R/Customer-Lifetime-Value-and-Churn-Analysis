# Data Catalog
#
# Medallion-style layout:
#   data/01_raw         -> immutable downloads (gitignored)
#   data/02_intermediate-> parsed but not yet cleaned data
#   data/03_primary     -> cleaned, analysis-ready data
#   data/08_reporting   -> human-facing reports and summaries
#
# Docs: https://docs.kedro.org/en/stable/catalog-data/introduction/

# ---------------------------------------------------------------------------
# Ingestion
# ---------------------------------------------------------------------------

# Path to the downloaded Online Retail II workbook (transient, in-memory).
raw_retail_download_path:
  type: MemoryDataset

# Raw transaction rows parsed from both yearly sheets.
transactions_raw:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/02_intermediate/transactions_raw.parquet

# Cleaned, analysis-ready transaction-level dataset.
transactions:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/transactions.parquet

# ---------------------------------------------------------------------------
# Feature quality
# ---------------------------------------------------------------------------

# Curated transactions: quality flags, robust (winsorised) columns,
# explicit net/gross revenue and grouped countries.
transactions_curated:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/transactions_curated.parquet

# Feature-quality validation report.
feature_quality_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/feature_quality_report.json

# Data-quality report produced by the validation node.
data_quality_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/data_quality_report.json

# Monthly business summary for reporting.
transactions_summary:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/transactions_summary.csv
  load_args:
    parse_dates: false
  save_args:
    index: false

# ---------------------------------------------------------------------------
# Feature engineering
# ---------------------------------------------------------------------------

# Customer-level feature store (one row per eligible customer, observation-only).
customer_features:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/04_feature/customer_features.parquet

# Temporally-held-out churn labels and observed future value.
churn_labels:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/05_model_input/churn_labels.parquet

# ---------------------------------------------------------------------------
# Baseline (current company strategy)
# ---------------------------------------------------------------------------

# Per-customer baseline targeting scores.
baseline_scores:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/baseline_scores.parquet

# Baseline evaluation report (business + classification metrics).
baseline_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/baseline_report.json

# ---------------------------------------------------------------------------
# Segmentation
# ---------------------------------------------------------------------------

# Per-customer cluster assignment and rule-based segment.
customer_segments:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/customer_segments.parquet

# Segment model-selection report.
segmentation_model_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/segmentation_model_report.json

# Segment profiles (business metrics per segment).
segment_profiles:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/segment_profiles.csv
  save_args:
    index: false

# Rule-based (RFM) segment profiles, for comparison with the clusters.
rule_segment_profiles:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/rule_segment_profiles.csv
  save_args:
    index: false

# Full segmentation report (profiles + characteristics + recommendations).
segmentation_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/segmentation_report.json

# ---------------------------------------------------------------------------
# Churn modelling
# ---------------------------------------------------------------------------

# Multi-cohort panel modelling table.
churn_model_input:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/05_model_input/churn_model_input.parquet

# Time-based splits.
train_data:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/05_model_input/train_data.parquet
validation_data:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/05_model_input/validation_data.parquet
test_data:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/05_model_input/test_data.parquet

# Evaluation outputs.
churn_model_metrics:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/churn_model_metrics.json
churn_test_predictions:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/churn_test_predictions.parquet
churn_feature_importance:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/churn_feature_importance.csv
  save_args:
    index: false

# Fitted (uncalibrated) churn pipeline, used for SHAP explanations.
churn_model:
  type: kedro_datasets.pickle.PickleDataset
  filepath: data/06_models/churn_model.pkl

# Survival analysis (exploratory).
survival_curves:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/survival_curves.csv
  save_args:
    index: false
survival_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/survival_report.json

# ---------------------------------------------------------------------------
# Customer lifetime value
# ---------------------------------------------------------------------------

# CLV model evaluation metrics.
clv_model_metrics:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/clv_model_metrics.json

# Predicted 90-day value per customer in the test cohort.
clv_test_predictions:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/clv_test_predictions.parquet

# CLV feature importance.
clv_feature_importance:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/clv_feature_importance.csv
  save_args:
    index: false

# Per-customer CLV and revenue at risk.
customer_value_risk:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/customer_value_risk.parquet

# Revenue-at-risk summary.
revenue_at_risk_summary:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/revenue_at_risk_summary.json

# ---------------------------------------------------------------------------
# Prioritisation, explainability and recommendations
# ---------------------------------------------------------------------------

# Customers ranked by expected revenue at risk.
retention_priorities:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/retention_priorities.parquet
prioritisation_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/prioritisation_report.json

# SHAP global importance, per-customer risk factors and report.
shap_global_importance:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/shap_global_importance.csv
  save_args:
    index: false
customer_risk_factors:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/customer_risk_factors.parquet
explainability_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/explainability_report.json

# Per-customer retention recommendations and executive action list.
customer_recommendations:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/customer_recommendations.parquet
recommendations_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/recommendations_report.json
