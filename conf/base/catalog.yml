# Data Catalog
#
# Medallion-style layout:
#   data/01_raw         -> immutable downloads (gitignored)
#   data/02_intermediate-> parsed but not yet cleaned data
#   data/03_primary     -> cleaned, analysis-ready data
#   data/08_reporting   -> human-facing reports and summaries
#
# Docs: https://docs.kedro.org/en/stable/catalog-data/introduction/

# ---------------------------------------------------------------------------
# Ingestion
# ---------------------------------------------------------------------------

# Path to the downloaded Online Retail II workbook (transient, in-memory).
raw_retail_download_path:
  type: MemoryDataset

# Raw transaction rows parsed from both yearly sheets.
transactions_raw:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/02_intermediate/transactions_raw.parquet

# Cleaned, analysis-ready transaction-level dataset.
transactions:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/transactions.parquet

# ---------------------------------------------------------------------------
# Feature quality
# ---------------------------------------------------------------------------

# Curated transactions: quality flags, robust (winsorised) columns,
# explicit net/gross revenue and grouped countries.
transactions_curated:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/transactions_curated.parquet

# Feature-quality validation report.
feature_quality_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/feature_quality_report.json

# Data-quality report produced by the validation node.
data_quality_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/data_quality_report.json

# Monthly business summary for reporting.
transactions_summary:
  type: kedro_datasets.pandas.CSVDataset
  filepath: data/08_reporting/transactions_summary.csv
  load_args:
    parse_dates: false
  save_args:
    index: false

# ---------------------------------------------------------------------------
# Feature engineering
# ---------------------------------------------------------------------------

# Customer-level feature store (one row per eligible customer, observation-only).
customer_features:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/04_feature/customer_features.parquet

# Temporally-held-out churn labels and observed future value.
churn_labels:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/05_model_input/churn_labels.parquet

# ---------------------------------------------------------------------------
# Baseline (current company strategy)
# ---------------------------------------------------------------------------

# Per-customer baseline targeting scores.
baseline_scores:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/07_model_output/baseline_scores.parquet

# Baseline evaluation report (business + classification metrics).
baseline_report:
  type: kedro_datasets.json.JSONDataset
  filepath: data/08_reporting/baseline_report.json
