# ---------------------------------------------------------------------------
# Data ingestion parameters
# ---------------------------------------------------------------------------
data_ingestion:
  # Candidate source URLs. The first working source is cached to raw_dir.
  source_urls:
    - "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
    - "https://archive.ics.uci.edu/ml/machine-learning-databases/00502/online_retail_II.xlsx"
  raw_dir: "data/01_raw"
  raw_filename: "online_retail_II.xlsx"
  force_download: false
  download_timeout_seconds: 300
  # Sheets inside the workbook. Both cover the period Dec 2009 - Dec 2011.
  sheet_names:
    - "Year 2009-2010"
    - "Year 2010-2011"

  cleaning:
    # Customer-level modelling requires an attributable customer.
    drop_missing_customer: true
    # Administrative rows (postage, bank charges, ...) are not products.
    drop_non_product_stock_codes: true
    non_product_stock_codes:
      - "POST"
      - "D"
      - "M"
      - "BANK CHARGES"
      - "PADS"
      - "DOT"
      - "C2"
      - "CRUK"
      - "S"
      - "AMAZONFEE"
      - "B"
      - "TEST"

  # Expectations used by the data-quality validation node.
  expected:
    min_invoice_date: "2009-12-01"
    max_invoice_date: "2011-12-31"

# ---------------------------------------------------------------------------
# Feature-quality parameters
# ---------------------------------------------------------------------------
data_quality:
  # Administrative stock codes that survived the ingestion filter.
  residual_admin_stock_codes:
    - "ADJUST"
    - "ADJUST2"
    - "SP1002"
    - "TEST001"
    - "TEST002"

  # Cap the tails of heavy-distributed columns instead of dropping customers.
  winsorise:
    lower_quantile: 0.001
    upper_quantile: 0.999

  # Collapse long-tail countries so categorical models stay stable.
  country_grouping:
    min_transactions_per_country: 100
    other_label: "Other"

  # Expectations used by the curated-data validation node.
  expected:
    stock_code_pattern: "^[0-9]{5}[A-Z]{0,3}$"
    max_invoice_date: "2011-12-31"

# ---------------------------------------------------------------------------
# Temporal design (observation -> prediction -> performance)
# ---------------------------------------------------------------------------
temporal:
  # Prediction point T. Features use transactions <= T only.
  cutoff_date: "2011-06-09"
  # Churn = no purchase in (T, T + performance_window_days].
  performance_window_days: 90
  # Rolling activity windows relative to T.
  recent_windows: [30, 90, 180, 365]

# ---------------------------------------------------------------------------
# Baseline (current / naive company strategy)
# ---------------------------------------------------------------------------
baseline:
  # "At risk" if no purchase for more than this many days at the cutoff.
  inactivity_days: 90

# ---------------------------------------------------------------------------
# Customer segmentation
# ---------------------------------------------------------------------------
segmentation:
  # Observation-window features used for clustering (log-transformed where skewed).
  cluster_features:
    - recency_days
    - n_orders
    - net_revenue
    - aov
    - avg_interval
    - n_unique_products
    - return_value_ratio
    - recent_revenue_share
    - tenure_days
    - product_diversity
  log_features:
    - n_orders
    - net_revenue
    - aov
    - n_unique_products
    - tenure_days
  k_range: [2, 3, 4, 5, 6, 7, 8]
  models: ["kmeans", "gmm", "hierarchical"]
  random_state: 42
  # Rule-based comparison thresholds.
  high_return_threshold: 0.5
  new_customer_days: 180
  # Retention strategy per interpretable segment (observational, not causal).
  strategy_map:
    Champions: "Reward loyalty, protect experience, drive referrals and upsell."
    Loyal customers: "Maintain engagement with loyalty tiers and cross-sell."
    High-value at risk: "Personalised high-touch retention offer / win-back."
    New customers: "Second-purchase incentive and onboarding campaign."
    Occasional buyers: "Value-oriented offers and bundles to build habit."
    High-return customers: "Investigate product dissatisfaction; recommend alternatives; review CX."
    Lost customers: "Low-cost win-back; deprioritise unless value is high."

# ---------------------------------------------------------------------------
# Churn modelling
# ---------------------------------------------------------------------------
churn_modeling:
  # Monthly prediction points; each gets its own observation features + label.
  cohort_dates:
    - "2011-03-01"
    - "2011-04-01"
    - "2011-05-01"
    - "2011-06-01"
    - "2011-07-01"
    - "2011-08-01"
    - "2011-09-01"
  # Time-based split: earlier cohorts train, latest cohorts validate/test.
  train_cohorts: ["2011-03-01", "2011-04-01", "2011-05-01", "2011-06-01", "2011-07-01"]
  validation_cohorts: ["2011-08-01"]
  test_cohorts: ["2011-09-01"]
  target: "churn"
  id_columns: ["customer_id", "cohort_date"]
  categorical_features: ["country_grouped"]
  exclude_features: ["future_revenue", "future_orders"]
  models: ["logistic_regression", "random_forest", "lightgbm"]
  model_params:
    logistic_regression:
      max_iter: 2000
      C: 1.0
    random_forest:
      n_estimators: 400
      min_samples_leaf: 5
    lightgbm:
      n_estimators: 400
      learning_rate: 0.05
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
  calibration_method: "isotonic"
  random_state: 42
  survival_features:
    - recency_days
    - n_orders
    - net_revenue
    - aov
    - return_value_ratio
    - avg_interval
  mlflow:
    enabled: true
    tracking_uri: "file:./mlruns"
    experiment_name: "customer-clv-churn"
