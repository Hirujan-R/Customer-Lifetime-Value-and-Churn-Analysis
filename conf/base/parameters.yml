# ---------------------------------------------------------------------------
# Data ingestion parameters
# ---------------------------------------------------------------------------
data_ingestion:
  # Candidate source URLs. The first working source is cached to raw_dir.
  source_urls:
    - "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
    - "https://archive.ics.uci.edu/ml/machine-learning-databases/00502/online_retail_II.xlsx"
  raw_dir: "data/01_raw"
  raw_filename: "online_retail_II.xlsx"
  force_download: false
  download_timeout_seconds: 300
  # Sheets inside the workbook. Both cover the period Dec 2009 - Dec 2011.
  sheet_names:
    - "Year 2009-2010"
    - "Year 2010-2011"

  cleaning:
    # Customer-level modelling requires an attributable customer.
    drop_missing_customer: true
    # Administrative rows (postage, bank charges, ...) are not products.
    drop_non_product_stock_codes: true
    non_product_stock_codes:
      - "POST"
      - "D"
      - "M"
      - "BANK CHARGES"
      - "PADS"
      - "DOT"
      - "C2"
      - "CRUK"
      - "S"
      - "AMAZONFEE"
      - "B"
      - "TEST"

  # Expectations used by the data-quality validation node.
  expected:
    min_invoice_date: "2009-12-01"
    max_invoice_date: "2011-12-31"

# ---------------------------------------------------------------------------
# Feature-quality parameters
# ---------------------------------------------------------------------------
data_quality:
  # Administrative stock codes that survived the ingestion filter.
  residual_admin_stock_codes:
    - "ADJUST"
    - "ADJUST2"
    - "SP1002"
    - "TEST001"
    - "TEST002"

  # Cap the tails of heavy-distributed columns instead of dropping customers.
  winsorise:
    lower_quantile: 0.001
    upper_quantile: 0.999

  # Collapse long-tail countries so categorical models stay stable.
  country_grouping:
    min_transactions_per_country: 100
    other_label: "Other"

  # Expectations used by the curated-data validation node.
  expected:
    stock_code_pattern: "^[0-9]{5}[A-Z]{0,3}$"
    max_invoice_date: "2011-12-31"

# ---------------------------------------------------------------------------
# Temporal design (observation -> prediction -> performance)
# ---------------------------------------------------------------------------
temporal:
  # Prediction point T. Features use transactions <= T only.
  cutoff_date: "2011-06-09"
  # Churn = no purchase in (T, T + performance_window_days].
  performance_window_days: 90
  # Rolling activity windows relative to T.
  recent_windows: [30, 90, 180, 365]

# ---------------------------------------------------------------------------
# Baseline (current / naive company strategy)
# ---------------------------------------------------------------------------
baseline:
  # "At risk" if no purchase for more than this many days at the cutoff.
  inactivity_days: 90
